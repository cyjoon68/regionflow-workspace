apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: regionflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/regionflow-data/regionflow-workspace.git
    targetRevision: develop
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: regionflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
