apiVersion: apps/v1
kind: Deployment
metadata:
  name: regionflow-be
spec:
  replicas: 2
  selector:
    matchLabels:
      app: regionflow-be
  template:
    metadata:
      labels:
        app: regionflow-be
        tags.datadoghq.com/service: regionflow-be
    spec:
      containers:
        - name: api
          image: ghcr.io/regionflow-data/regionflow-be:develop
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: regionflow-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: regionflow-be
spec:
  selector:
    app: regionflow-be
  ports:
    - port: 8080
      targetPort: 8080
